[project]
name = "ge-notebooklm-sdp-governance-demo"
version = "1.0.0"
description = "End-to-End Sensitive Data Protection (SDP & Model Armor) Governance Demo for Gemini Enterprise and NotebookLM Enterprise"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.29.0",
    "google-auth-httplib2>=0.2.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-dlp>=3.16.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-storage>=2.16.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.1.0",
    "rich>=13.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
